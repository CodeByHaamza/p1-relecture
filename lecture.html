<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture — Relecture Persona 1 FR</title>
<meta name="description" content="Lire un script de la traduction française de Persona 1 PSP et proposer des corrections, avec vérification des contraintes du jeu.">
<!-- Les polices sont servies d'ici : aucun appel reseau ne part de cette page.
     Les deux fichiers qui portent le texte sont precharges, pour que rien ne
     danse au premier affichage. -->
<link rel="preload" href="polices/spectral-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="polices/marcellus-sc-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/polices.css">
<link rel="stylesheet" href="css/commun.css">
<link rel="stylesheet" href="css/lecture.css">
</head>
<body data-anglais="non">

<header class="barre">
  <div class="barre__dedans">
    <a class="retour" href="index.html">← Sommaire</a>
    <h1 class="barre__titre" id="titre">
      <small id="zone">—</small>
      <span id="nom">Chargement…</span>
    </h1>
    <button class="bascule" id="voirAnglais" type="button" aria-pressed="false"
            title="Afficher l'anglais d'origine sous chaque réplique (touche A)">
      Anglais
    </button>
    <button class="bascule" id="taille" type="button">A 2/3</button>
    <button class="bascule" id="voirCodes" type="button" aria-pressed="false"
            title="Écrire les codes de fin de ligne au lieu de les laisser dire par la mise en page (touche C)">
      Codes
    </button>
    <!-- Mon fil, pas celui du projet : « signaler relu » (dans le panier) est
         le geste partage, celui-ci ne sort pas du navigateur. -->
    <button class="bascule" id="marquerLu" type="button" aria-pressed="false"
            title="Garder la trace de votre lecture, dans ce navigateur seulement">
      Lu par moi
    </button>
  </div>
  <div class="avancee" aria-hidden="true"><div class="avancee__fait" id="avancee"></div></div>
</header>

<main>
  <div class="fil" id="fil">
    <p class="chargement">Ouverture du script…</p>
  </div>
</main>

<!-- Relire trois cents repliques a la souris est epuisant. Le clavier fait le
     meme travail sans quitter la position de lecture. -->
<p class="raccourcis">
  <kbd>J</kbd><kbd>K</kbd> ou <kbd>↓</kbd><kbd>↑</kbd> se déplacer ·
  <kbd>E</kbd> proposer · <kbd>Échap</kbd> fermer ·
  <kbd>A</kbd> anglais · <kbd>C</kbd> codes ·
  <kbd>[</kbd><kbd>]</kbd> scène · <kbd>N</kbd><kbd>P</kbd> script
</p>

<div class="panier" id="panier" data-plein="non" role="status">
  <span id="panierTexte">Lu en entier&nbsp;?</span>
  <button class="bouton bouton--fort" id="envoyer" type="button">Signaler relu</button>
  <button class="bouton" id="vider" type="button" data-vider>Vider</button>
</div>

<script type="module" src="js/lecture.js"></script>
</body>
</html>
